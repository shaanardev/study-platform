# Complete dependency setup before `wt switch --create` returns.
pre-start = "pnpm install --frozen-lockfile"

# Run fast static checks before each Worktrunk commit.
pre-commit = "pnpm lint"

# Run the coverage gate after rebase and before Worktrunk merges the branch.
pre-merge = "pnpm coverage:check"

# Match the Conventional Commit format used in this repository's history.
[commit.generation]
template-append = """
- Use a lowercase Conventional Commit subject in `type(scope): summary` form; the scope is optional.
- Match established types and scopes, such as `feat(agents): ...`, `fix(citations): ...`, and `standardize: ...`.
- Keep the summary concise and imperative.
- Write a concise Markdown bullet list in the body, with each bullet starting with `- ` and describing one key change in a single sentence.
- Put distinct changes in separate bullets instead of joining them with `and`.
- After the Markdown bullet list, add a blank line and then the trailer `Co-authored-by: Codex <noreply@openai.com>`.
- Keep trailers outside the Markdown bullet list: never prefix a trailer with `- ` or format it as a bullet.
- Preserve relevant trailers such as `Co-authored-by`; do not invent issue references.
"""
